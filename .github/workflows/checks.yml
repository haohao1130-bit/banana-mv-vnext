name: VNext MV offline contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pillow numpy ipython
      - run: python -m unittest discover -s tests -v
      - run: node tests/check_ui.cjs && node tests/check_asset_reuse.cjs
