name: VNext MV offline contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    env:
      BANANA_DATA: /tmp/banana-mv-vnext-checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install pillow numpy ipython
      - run: python -m unittest discover -s tests -v
      - run: node tests/check_ui.cjs && node tests/check_asset_reuse.cjs
      - run: python tools/build_notebook.py && git diff --exit-code Banana_MV_Public.ipynb BANANAMV_VNEXT.ipynb
      - name: Parse Windows launcher
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD 'tools/start_local.ps1'), [ref]$tokens, [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List
            exit 1
          }
